--- # research-submission venue record
# 內容擷取自 IMS 官方頁面（imstat.org，經 Safari 通過 Anubis 挑戰）、Project Euclid、
# EJMS 與 VTeX LaTeX 支援頁，2026-10-08。
# imstat.org 全站以 Anubis proof-of-work 擋 curl 與 WebFetch，規定本體只能用真實瀏覽器取得；
# 各 source 的 fetch 欄位記錄了這件事。

schema_version: 1
id: ims/annals-of-statistics
kind: journal
family: statistics-journals
status: active

# ─────────────────────────────────────────────────────────────
# 來源與 provenance。AoS 的須知拆成十幾個子頁，規定本體分散在
# Manuscript Preparation、Supplement Instructions、Manuscript Handling Procedures、
# Guidelines for Referees、Guidelines for Associate Editors、Ethical Principles 六頁。
# 所有 imstat.org 子頁網址皆由期刊首頁側欄連結取得，非推測。
# ─────────────────────────────────────────────────────────────
sources:
  - id: manuscript_preparation
    role: authoritative
    url: https://imstat.org/journals-and-publications/annals-of-statistics/annals-of-statistics-manuscript-preparation/
    note: >-
      投稿條件、EJMS 入口、LaTeX 範本要求、篇幅、affiliation 與致謝政策都在這一頁。
      頁面上「template」連結指向 http://www.e-publications.org/ims/support/ims-instructions.html。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        imstat.org 全站由 Anubis（v1.28.0-pre2）proof-of-work 挑戰保護：curl 回 HTTP 200 +
        7355–7356 bytes 的「Making sure you're not a bot!」頁（非 403）。2026-10-08 實測 11 個
        不同 imstat.org URL 回應大小幾乎相同（決定性證據：全是同一個挑戰頁）。WebFetch 同樣
        只拿到 Anubis 頁。須以 safari-browser 開啟、等 JS 解完挑戰後讀 innerText。
      validity:
        must_contain: "A typical paper should not exceed 25 pages"
        min_extracted_chars: 2000
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: supplement_instructions
    role: authoritative
    url: https://imstat.org/journals-and-publications/annals-of-statistics/annals-of-statistics-supplement-instructions/
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Anubis proof-of-work 挑戰頁（HTTP 200 + 7356 bytes），同 manuscript_preparation
      validity:
        must_contain: "it is the journal policy to post ALL supplemental files"
        min_extracted_chars: 2000
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: handling_procedures
    role: authoritative
    url: https://imstat.org/journals-and-publications/annals-of-statistics/annals-of-statistics-manuscript-handling-procedures/
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Anubis proof-of-work 挑戰頁（HTTP 200 + 7356 bytes），同 manuscript_preparation
      validity:
        must_contain: "The Associate Editor quickly screens papers"
        min_extracted_chars: 1800
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: referee_guidelines
    role: authoritative
    url: https://imstat.org/journals-and-publications/annals-of-statistics/annals-of-statistics-guidelines-for-referees/
    note: 審稿判準（三項）與審稿人建議類別的正式文字在此頁；作者端判斷「會被怎麼評」以此為準。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Anubis proof-of-work 挑戰頁（HTTP 200 + 7355 bytes），同 manuscript_preparation
      validity:
        must_contain: "Technical sophistication alone is not sufficient grounds for publication"
        min_extracted_chars: 4000
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: ae_guidelines
    role: authoritative
    url: https://imstat.org/journals-and-publications/annals-of-statistics/annals-of-statistics-guidelines-for-associate-editors/
    note: >-
      給副編輯的內部準則，但對作者最有資訊量：desk-reject 比例、審稿時程目標、
      「statistical innovation」判準、cover letter 須寫出 key innovations、作者須願意擔任審稿人。
      頁首說作者須遵守的政策與 author certifications「appended below」，但 2026-10-08 實際頁面
      內容在 "The IMS mission statement for the AoS provides guidance and is as follows." 之後
      就結束，附錄政策與 certifications 不在頁上（已檢查 DOM，無隱藏內容）。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Anubis proof-of-work 挑戰頁（HTTP 200 + 7356 bytes），同 manuscript_preparation
      validity:
        must_contain: "Mathematical depth is neither necessary nor sufficient"
        min_extracted_chars: 8000
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: ethical_principles
    role: authoritative
    url: https://imstat.org/journals-and-publications/annals-of-statistics/annals-of-statistics-ethical-principles/
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Anubis proof-of-work 挑戰頁（HTTP 200 + 7356 bytes），同 manuscript_preparation
      validity:
        must_contain: "Plagiarism, including self-transcription"
        min_extracted_chars: 4500
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: editorial_policy
    role: authoritative
    url: https://imstat.org/journals-and-publications/annals-of-statistics/annals-of-statistics-editorial-policy/
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Anubis proof-of-work 挑戰頁（HTTP 200 + 7356 bytes），同 manuscript_preparation
      validity:
        must_contain: "not on formalism"
        min_extracted_chars: 1200
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: acceptance_of_papers
    role: authoritative
