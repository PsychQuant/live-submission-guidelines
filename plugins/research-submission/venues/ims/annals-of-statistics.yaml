    note: IMS 層級的 arXiv 政策頁，由首頁 Publications 選單（Electronic Access 底下）連入。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Anubis proof-of-work 挑戰頁（HTTP 200 + 7356 bytes），同 manuscript_preparation
      validity:
        must_contain: "The IMS encourages all members to post their articles on arXiv"
        min_extracted_chars: 1000
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: journal_home
