warnings:
  - 篇幅上限寫成 "pages"（regular 與 synthesis "normally fewer than 20"，miscellanea "max. 8"），官方未定義以何種版面計頁、也未說參考文獻與補充材料計不計入
  - 只談既有程序抽樣性質（或其小幅延伸）的論文通常不適合，除非揭示可觀的結構性理解；純應用研究不刊
  - 主文所有圖都必須附 alt text，放在圖說正下方、以 'Alt text:' 開頭
  - 寫作中用了生成式 AI，必須同時在 cover letter 與主文（Acknowledgement 之前的固定標題段落）揭露
  - 投稿 synthesis paper 必須在 Step 5 附 cover letter 說明符合哪一項條件
