--- # research-submission venue record
# 內容擷取自 Oxford Academic 上的 Biometrika 官方頁面，以及 instructions 頁連出的官方
# style guide 壓縮檔，2026-10-08。
# Biometrika 由 Oxford University Press 與 Biometrika Trust 合作出版。Trust 自己的網站
# （www.biometrikatrust.org）的 "Author Information" 連回 OUP 的 General_Instructions，
# 所以作者須知的正本在 OUP，Trust 網站只當 supporting。

schema_version: 1
id: biometrika-trust/biometrika
kind: journal
family: statistics-journals
status: active

# ─────────────────────────────────────────────────────────────
sources:
  - id: instructions
    role: authoritative
    url: https://academic.oup.com/biomet/pages/General_Instructions
    note: >-
      從期刊首頁 Submit 選單的 "Author Guidelines" 點入，頁內標題是 "Information for Authors"。
      首頁 Submit 選單的 "Open Access" 也連到同一頁。Editor 的信箱取自頁內 "Paul Fearnhead"
      的 mailto 連結。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: >-
        Cloudflare managed challenge：curl 不論用預設 UA 或 verify.py 的 UA，都回 HTTP 403
        加約 5.4–5.7 KB 的 "Just a moment..." 頁（Biometrika 四個 OUP 頁面與 ScholarOne 入口
        皆同）。WebFetch 能通過挑戰，但只回模型摘要、拒絕逐字重現，無法斷言 must_contain；
        本記錄的逐字內容是用 safari-browser 讀 document.body.innerText 取得。
      validity:
        must_contain: "Biometrika strongly encourages authors to make all data and software code"
        min_extracted_chars: 6000
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: style_guide
    role: authoritative
    url: https://static.primary.prod.gcms.the-infra.com/static/site/biomet/document/biometrika-2025.zip?node=2c33dd0d691d6381de39
    note: >-
      instructions 頁 "Style Guide and LaTeX Template" 段的 "Download the style guide and LaTeX
      template" 連結。這是 zip 壓縮檔（目錄 Biometrika2025/，含 biometrika.cls、biometrika.bst、
      styleguide.tex 與 styleguide.pdf、lineno.sty 等），規定本文在 styleguide.tex
      （"Some notes on Biometrika style"）。本記錄的內容是解壓後逐字讀 styleguide.tex 取得；
      2026-10-08 下載的壓縮檔 sha256 為 10e3aa4103f49c15d357bc1576fbc0eafde4e611dd23fe7b273a59c9f0416294，
      styleguide.tex 檔案日期 2025-02-03。
      verify.py 的 HTML 抽取器讀不到壓縮後的內文：must_contain 用的是壓縮檔目錄裡的成員檔名，
      只能斷言「抓到的是這個壓縮檔、不是錯誤頁」，不能斷言規定內容；hash 等於監看整個壓縮檔。
      檔名帶年份、網址帶 node 參數，改版時網址很可能換掉，屆時要從 instructions 頁重新點入。
      style guide 自述投稿時不必符合這些格式，錄取後才可能要求修改。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "Biometrika2025/styleguide.tex"
        min_extracted_chars: 500000
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: about
    role: authoritative
    url: https://academic.oup.com/biomet/pages/About
    note: 範圍、三項審稿判準、三種論文類型，以及 "Journal metrics" 表。從首頁 About 選單的 "About Biometrika" 點入。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 instructions（Cloudflare 403 挑戰頁；WebFetch 只給摘要）。
      validity:
        must_contain: "The three primary criteria by which all papers are judged are"
        min_extracted_chars: 2500
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: publishing
    role: supporting
    url: https://academic.oup.com/biomet/pages/publishing-in-biometrika
    note: 首頁 Submit 選單的 "Why Publish with Biometrika?"。錄取率、首次決定時間、投稿系統名稱的出處。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 instructions（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "around 13% are accepted for publication"
        min_extracted_chars: 2000
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: reviewer_guidelines
    role: supporting
    url: https://academic.oup.com/biomet/pages/reviewer-guidelines
    note: 寫給審稿人，但載有審稿判準與四種建議決定，對判斷適不適合投稿有用。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: 同 instructions（Cloudflare 403 挑戰頁）。
      validity:
        must_contain: "Most Biometrika papers will support new statistical methods with relevant theory"
        min_extracted_chars: 3000
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

  - id: journal_home
    role: supporting
    url: https://academic.oup.com/biomet
    note: 導覽選單（Submit、About）與首頁上的指標摘要。curl 回 403 挑戰頁；WebFetch 讀得到導覽連結與指標。
    fetch:
      method: webfetch
      http_viable: false
      http_failure_mode: Cloudflare managed challenge，HTTP 403 + 5403 bytes 的 "Just a moment..." 頁。
    snapshot: {fetched_at: 2026-10-08, last_verified_at: 2026-10-08}

  - id: oa_charges
    role: supporting
    url: https://academic.oup.com/pages/open-research/open-access/charges-licences-and-self-archiving
    note: >-
      instructions 頁 "Details of the open access licences and open access charges" 連到
      /journals/pages/open_access/charges，會轉址到這裡。這是 OUP 全社的頁面；金額要在頁內表單
      選 Journal = Biometrika（option value BIOMET）與 Manuscript category，再按 "Show charge"
      才會顯示，WebFetch 只看得到空表單。
    fetch:
      method: browser
      http_viable: false
      http_failure_mode: Cloudflare 403 挑戰頁；且金額由 JavaScript 表單產生，必須在真實瀏覽器操作。
    snapshot: {fetched_at: 2026-10-08, last_verified_at: 2026-10-08}

  - id: trust_journal
    role: supporting
    url: https://www.biometrikatrust.org/Journal
    note: >-
      Biometrika Trust 網站的期刊頁（Google Sites）。"Author Information" 連到 OUP 的
      General_Instructions；另載編輯部信箱與歷任主編。不帶 www 的 biometrikatrust.org 與
      biometrika.org 在 2026-10-08 都無法解析（DNS）。
    fetch:
      method: http
      http_viable: true
      validity:
        must_contain: "For information on an article currently under review"
        min_extracted_chars: 800
    snapshot:
      fetched_at: 2026-10-08
      last_verified_at: 2026-10-08
      extracted_sha256: null

# ─────────────────────────────────────────────────────────────
identity:
  name: Biometrika
  publisher: Oxford University Press
  owner: {name: Biometrika Trust, note: OUP 與 Biometrika Trust 合作出版；頁尾版權屬 Biometrika Trust, src: publishing}
  issn:
    electronic: "1464-3510"
    print: {status: not_found, checked: 2026-10-08, note: 官方頁面頁尾只列 Online ISSN, src: about}
  homepage: https://academic.oup.com/biomet
  society_site: https://www.biometrikatrust.org/
  founded: {value: 1901, src: trust_journal}
  editor: {name: Paul Fearnhead, email: editor@biometrikatrust.org, note: 編務與投稿詢問寄這個信箱, src: instructions}
  editorial_office: {email: editorial@biometrika.org.uk, note: 審查中、即將刊出或已刊文章的查詢, src: trust_journal}
  frequency: {status: not_found, checked: 2026-10-08, note: instructions 與 About 頁都沒寫}
  metrics:
    impact_factor: {value: 2.8, year: 2025, provider: Clarivate, as_of: 2026-10-08, src: about}
    impact_factor_5yr: {value: 4.1, year: 2025, provider: Clarivate, as_of: 2026-10-08, src: about}
    category_rank: {value: "22/170", category: "Statistics & Probability", basis: Impact Factor, as_of: 2026-10-08, src: about}
    citescore: {value: 5.4, year: 2025, provider: Scopus, as_of: 2026-10-08, src: about}
    citescore_rank: {value: "37/303", category: "Statistics And Probability", as_of: 2026-10-08, src: about}
    acceptance_rate:
      value: "around 13%"
      quote: "Of the many worthwhile submissions received, around 13% are accepted for publication."
      note: 未載統計期間
      as_of: 2026-10-08
      src: publishing
    time_to_first_decision:
      value: "Nearly 75% of submissions receive a first decision within one month, and almost all receive a decision within five months."
      note: 未載統計期間
      as_of: 2026-10-08
