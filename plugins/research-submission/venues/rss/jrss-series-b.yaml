# ─────────────────────────────────────────────────────────────
warnings:
  - 不依須知準備的稿件，編輯可直接退回（"The Editors may return manuscripts that do not follow these instructions."）
  - 投稿當下就要把可重現全部實證結果的程式碼交給審稿人與編輯；錄取前程式碼須公開並有 DOI，URL 與 DOI 要寫進正文
  - 只具數學興趣、或以例行模擬為主的論文，即使正確也可能被拒
  - 篇幅以每頁 28 行、含附錄與參考文獻計算，盡量少於 30 頁；約 35 頁以上在初篩階段就容易得到負面評價
  - 使用 AI 必須同時在 cover letter 與 Methods 或 Acknowledgements 中揭露
