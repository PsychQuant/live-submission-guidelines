cycle:
  applies_to: null
  rolling_calls:
    - id: discussion_papers
      label: RSS Discussion Meeting 論文
      type: general_ongoing
      deadline: {status: not_applicable, note: "There are no submission deadlines for papers that are aimed at Series A or Series C."}
      wants: 能引發討論的論文；社論要求 "discussability" 須落在對應用核心的面向上，具突破性與大影響潛力
      src: oup_instructions
    - id: special_issue_proposals
      label: 專刊提案
      type: general_ongoing
      deadline: {status: not_applicable, note: 隨時以非正式方式寄給共同主編}
      wants: 客座編輯名單與資格、主題為何對應用統計及時且重要的簡述、Call for Papers 草稿
      src: editorial_2025

# ─────────────────────────────────────────────────────────────
warnings:
  - >-
    範圍門檻：應用必須是論文核心與動機。官方明寫 "Methodological papers that are not motivated by a genuine
    application are not acceptable"，應用只作示範、只有簡短數值例、以模擬為主的論文都不適合；
    應用通常要出現在標題中。
  - '"Extended algebraic treatment should be avoided."：數學推導如屬必要放附錄，證明可移到補充材料。'
  - 篇幅超過 24 個期刊排版頁（約 12000 字）"unlikely to be accepted"；討論論文除外。
  - >-
    投稿表單有強制的資料與程式碼聲明；無法提供資料或程式碼且理由不充分時，編輯保留拒絕刊登的權利。
  - >-
    兩個來源不一致之處：編輯部 email（journal@rss.org.uk vs jrsssc.editorialoffice@oup.com）；
    初投是否要交 LaTeX 原始檔（OUP 頁要 zip + PDF，RSS Notes 建議初投只交 PDF）；
    APC 金額（OUP 查詢工具 £2,945，RSS Notes 2025 寫 £2,621）。以 OUP 現行頁面為準，有疑義先問編輯部。
