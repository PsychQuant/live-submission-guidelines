cycle:
  applies_to: null
  rolling_calls:
    - id: data_intensive_methods
      label: "Special Issue: Data Intensive Methods in Psychometrics"
      section: theory_and_methods
      type: special_issue
      wants: >-
        利用「許多個」資料集（而非單一大型資料集）推進方法論研究；新方法在資料密集情境的表現，
        或用大量資料檢驗既有方法的實際功能。須符合 Theory and Methods 的標準。
      process: >-
        先向客座編輯交 500 字以內的短提案；全文經一般審查流程，投稿時在 ScholarOne 選擇該 special issue。
        逾期提案可直接聯絡客座編輯。
      deadlines:
        - {id: proposal, date: 2026-03-15, timezone: {status: not_published, checked: 2026-10-08}, note: 已過}
        - {id: proposal_feedback, date: 2026-04-15, note: 官方寫 "We aim to supply feedback by"}
        - {id: full_manuscript, date: 2027-03-01, timezone: {status: not_published, checked: 2026-10-08}}
      guest_editors: [Benjamin W. Domingue, Kylie Gorney, Jonas Haslbeck, Klint Kanopka, Leonie V.D.E. Vogelsmeier]
      posted: 2026-01-15
      url: https://www.psychometricsociety.org/post/call-special-issue-intensive-methods
      src: call_data_intensive
    - id: acs_ai_diagnostic
      label: "ACS Special Section: Leveraging AI to Empower Development and Application of Diagnostic Statistical Models"
      section: application_and_case_studies
      type: special_section
      deadlines:
        - {id: submission, date: 2025-10-31, note: 已過；學會頁未標 CLOSED}
      posted: 2025-07-15
      url: https://www.psychometricsociety.org/post/call-papers-psychometrika-applications-and-case-studies-acs
      src: call_acs_ai_diagnostic

# ─────────────────────────────────────────────────────────────
warnings:
  - >-
    Theory & Methods 與 ACS 稿件以約 40 頁雙倍行距、12 pt 為上限（含參考文獻、表、圖，不含附錄）；
    超過者 "will be sent back to the authors with a request to revise"。要超長必須在投稿前先聯絡 Editor-in-Chief。
  - >-
    雙盲審查：cover page 與匿名稿件分成兩個檔；作者姓名不得出現在正文的 header 或 author note。
  - >-
    全面 Gold OA。研究類文章接受後收 APC（USD 3,655／GBP 2,610；學會會員 USD 2,740／GBP 1,960，可能另加稅），
    除非機構協議或減免涵蓋；減免是接受後才申請。
  - >-
    分析程式碼必須放在補充材料（TOP Level II）；無法提供者要在投稿時就聲明例外。所有稿件都要有 Data Availability statement。
  - >-
    官方頁面彼此有出入：Data Availability statement 的位置（cover page 或 References 前的 back matter），
    以及第二個 section 的名稱（ACS 或 "Application Reviews and Case Studies"）。投稿前宜向 psychometrika@cambridge.org 確認。
  - >-
    Springer 舊期刊頁（link.springer.com/journal/11336）仍在線，內容停在 2024 年以前，不可作為現行規定的依據。
  - 通訊作者投稿時必須有 ORCID。
