--- # research-submission venue record
# 內容擷取自 Cambridge Core 的 Psychometrika 期刊頁與 Psychometric Society 官網，2026-10-08。
#
# 出版社轉移：Psychometrika 自 2025 年起由 Cambridge University Press 代學會（期刊所有人）出版；
# 之前是 Springer。Springer 舊頁仍在線、內容停在 2024 以前（Hybrid、ARCS 舊名），見 source springer_legacy。
#
# 抓取注意：2026-10-08 擷取時，Cambridge Core 全站頁首有一段 "Temporary Disruption" 橫幅
# （約 230 字元），會進入抽取後純文字。橫幅撤下時，所有 Cambridge 來源的 hash 會一起變動——
# 屆時 verify.py 回報 CHANGED 是橫幅造成，不代表須知改版，須人工比對正文。

schema_version: 1
id: psychometric-society/psychometrika
kind: journal
family: psychometrics-journals
status: active

